<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- paper tooth, baked once and tiled at low opacity by the sketchbook theme -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .26  .15 0 0 0 0"/>
  </filter>
  <rect width="180" height="180" filter="url(#p)"/>
</svg>
